name: CI/CD encurta-url

on:
  push:
    branches: &trigger_branches [ "release" ]
    paths: &trigger_paths
      - 'backend/encurta-url/**'
  pull_request:
    branches: *trigger_branches
    paths: *trigger_paths

jobs:
  unit-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Unit test
      run: mvn -B test --file pom.xml
      working-directory: backend/encurta-url/

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Atualiza grafo de dependências
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      with:
        directory: backend/encurta-url/
        token: ${{ secrets.GITHUB_TOKEN }}

  integration-test:
    needs: unit-test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Integration test
      run: mvn -B verify --file pom.xml
      working-directory: backend/encurta-url/
      env:
        REDIS_PORT: ${{secrets.REDIS_PORT}}
        GRPC_SERVER_PORT: ${{secrets.GRPC_SERVER_PORT}}
        CASSANDRA_KEYSPACE: ${{secrets.CASSANDRA_KEYSPACE}}
        CASSANDRA_CONTACT_POINTS: ${{secrets.CASSANDRA_CONTACT_POINTS}}
        CASSANDRA_PORT: ${{secrets.CASSANDRA_PORT}}
        CASSANDRA_DATACENTER: ${{secrets.CASSANDRA_DATACENTER}}
        APP_PROTOCOL: https
        APP_DOMAIN: e-url.com
        HOSTNAME: localhost

  docker-buildx:
    needs: integration-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: 'true'

      - name: Login na Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3
    
      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: backend/encurta-url/
          file: backend/encurta-url/Dockerfile
          tags: ${{ steps.login-ecr.outputs.registry }}/${{secrets.AWS_ENCURTAURL_REPOSITORY_NAME}}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Atualizar EC2
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_IDS }}" \
            --document-name "${{ secrets.AWS_DOCUMENT_NAME }}" \
            --region ${{ secrets.AWS_REGION }} \
            --parameters "commands=[
              \"cd ${{ secrets.AWS_PROJECT_PATH }}\",
              \"aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}\",
              \"docker compose pull\",
              \"docker compose up -d\",
              \"docker logout ${{ steps.login-ecr.outputs.registry }}\",
              \"docker image prune -f\"
            ]"
