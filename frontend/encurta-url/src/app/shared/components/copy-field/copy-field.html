<div class="copy-container">
  <div class="input-group">

    @if (isLink()) {
      <a [href]="textToCopy()" target="_blank" class="input-style-link">
        {{ textToCopy() }}
      </a>
    } @else {
      <input type="text" [value]="textToCopy()" readonly />
    }

    <button (click)="copy()" class="copy-btn">
      <i class="fa-regular fa-copy"></i>
      Copiar
    </button>
  </div>
  
  @if (isCopied()) {
    <span class="copy-badge">Copiado!</span>
  }
</div>
