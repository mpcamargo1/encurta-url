  <form id="encurtar-link-form"[formGroup]="encurtaForm" #formDir="ngForm" (ngSubmit)="submit()">
    <div id="input-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-link2-icon lucide-link-2"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
        <input type="text" placeholder="Cole sua URL longa aqui..." required formControlName="longUrl"/>
    </div>
    <div id="btn-container">
       <button id = "encurtar-btn" class="primary-color-btn" type="submit" [disabled]="waitingResponse()">
        @if(waitingResponse()) {
          <span class="spinner"></span>
        }
        @else {
        Encurtar <i class="fa-solid fa-arrow-right"></i>
        }
       </button>
    </div>
  </form>
@if (longUrl.touched && longUrl.dirty && longUrl.invalid) {
  <div class="validation-error-hint">
    <i class="fa-solid fa-circle-exclamation"></i>

    @if (longUrl.errors?.['required']) {
      <p>A URL deve ser preenchida!</p>
    }

    @if (longUrl.errors?.['maxlength']) {
      <p>A URL excede o número de caracteres!</p>
    }
  </div>
}
